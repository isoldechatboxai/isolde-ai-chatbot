# k8s/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolde-backend
  namespace: production
  labels:
    app: isolde-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: isolde-backend
  template:
    metadata:
      labels:
        app: isolde-backend
    spec:
      containers:
      - name: isolde-backend
        image: isolde-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: isolde-backend-service
  namespace: production
spec:
  type: LoadBalancer
  selector:
    app: isolde-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000