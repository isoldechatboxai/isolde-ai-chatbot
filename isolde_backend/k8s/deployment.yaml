# k8s/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolde-backend
  namespace: production
  labels:
    app: isolde-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: isolde-backend
  template:
    metadata:
      labels:
        app: isolde-backend
    spec:
      containers:
      - name: isolde-backend
        image: isolde-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_DEBUG
          value: "false"
        - name: TRUST_PROXY_HOPS
          value: "1"
        - name: RAG_STORAGE_BACKEND
          value: "database"
        # Migrations must be run once by CI/CD (or a dedicated Job) before
        # this multi-replica Deployment rolls out.  Letting every pod run
        # Alembic at startup races schema changes and can delay readiness.
        - name: SKIP_DB_MIGRATE
          value: "1"
        envFrom:
        - secretRef:
            name: isolde-backend-secrets
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/live
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: isolde-backend-service
  namespace: production
spec:
  type: LoadBalancer
  selector:
    app: isolde-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
