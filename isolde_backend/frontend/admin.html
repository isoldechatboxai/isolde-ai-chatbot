<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolde Admin</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main style="max-width:1000px;margin:40px auto;padding:24px">
  <h1>Isolde Admin</h1>
  <section id="admin-login">
    <p id="admin-message"></p>
    <form id="admin-login-form">
      <input id="admin-email" type="email" placeholder="Admin email" required>
      <input id="admin-password" type="password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>
  <section id="admin-dashboard" hidden>
    <button id="admin-logout" type="button">Log out</button>
    <h2>Live system totals</h2>
    <dl id="admin-stats"></dl>
    <h2>Users</h2>
    <p id="admin-empty" hidden>No users.</p>
    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="admin-users"></tbody></table>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
