<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolde AI - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 10px 0 0;
            color: var(--text-main);
            font-size: 24px;
        }

        .brand p {
            color: var(--text-muted);
            margin: 5px 0 0;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: white;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .2);
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 68px; }
        .password-toggle { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); min-height: 36px; border: 0; border-radius: 7px; background: transparent; color: var(--text-muted); cursor: pointer; }
        .password-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .auth-btn:hover {
            background-color: var(--primary-hover);
        }
        .auth-btn:disabled { cursor: not-allowed; opacity: .62; }
        .auth-btn[aria-busy="true"] .btn-text::before { content: ""; display: inline-block; width: .8em; height: .8em; margin-right: .5em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: auth-spin .75s linear infinite; }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
        .password-guidance { margin: -12px 0 16px; font-size: 12px; color: var(--text-muted); }
        @media (max-width: 480px) { body { height: auto; min-height: 100vh; align-items: flex-start; padding: 24px 12px; box-sizing: border-box; } .auth-card { padding: 28px 22px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

        .switch-page {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-page a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .switch-page a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
        .message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .message.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <div style="font-size: 32px;">🤖</div>
            <h1>Create Account</h1>
            <p>Register to use Isolde AI</p>
        </div>

        <div id="message-container" class="message" role="alert" aria-live="polite"></div>

        <form id="register-form" novalidate>
            <div class="input-group">
                <label for="username">Name</label>
                <input type="text" id="username" name="name" autocomplete="name" placeholder="Your name" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrap"><input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters, including a letter and number" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button></div>
            </div>
            <p class="password-guidance">Use at least 8 characters with a letter and a number.</p>

            <div class="input-group">
                <label for="confirm-password">Confirm password</label>
                <div class="password-wrap"><input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" placeholder="Repeat your password" required><button type="button" class="password-toggle" data-password-toggle="confirm-password" aria-label="Show confirmation password" aria-pressed="false">Show</button></div>
            </div>

            <button type="submit" class="auth-btn" id="register-btn">
                <span class="btn-text">Register</span>
            </button>
        </form>

        <div class="switch-page">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            const msg = document.getElementById('message-container');
            const setMessage = (type, text) => { msg.textContent = text; msg.className = `message ${type}`; };
            document.querySelectorAll('[data-password-toggle]').forEach((button) => button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.passwordToggle);
                const visible = input.type === 'password';
                input.type = visible ? 'text' : 'password';
                button.textContent = visible ? 'Hide' : 'Show';
                button.setAttribute('aria-pressed', String(visible));
                button.setAttribute('aria-label', `${visible ? 'Hide' : 'Show'} password`);
            }));

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const button = document.getElementById('register-btn');
                    if (button.disabled) return;
                    button.disabled = true;
                    button.setAttribute('aria-busy', 'true');
                    button.querySelector('.btn-text').textContent = 'Creating account…';
                    const name = document.getElementById('username').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirm-password').value;
                    if (!name || !email || !password) {
                        setMessage('error', 'Complete every field to create your account.');
                        button.disabled = false;
                        button.setAttribute('aria-busy', 'false');
                        button.querySelector('.btn-text').textContent = 'Register';
                        return;
                    }
                    if (password !== confirmPassword) {
                        setMessage('error', 'Password and confirmation do not match.');
                        button.disabled = false;
                        button.setAttribute('aria-busy', 'false');
                        button.querySelector('.btn-text').textContent = 'Register';
                        return;
                    }

                    try {
                        const res = await fetch('/api/register', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name, email, password})
                        });
                        const data = await res.json().catch(() => ({}));

                        if(res.ok) {
                            setMessage('success', data.message || "Registration successful. Check your email to verify the account.");
                        } else {
                            setMessage('error', data.error || (res.status === 429 ? 'Too many attempts. Please wait and try again.' : 'Registration failed.'));
                        }
                    } catch(err) {
                        setMessage('error', "Unable to connect to ISOLDE. Please try again.");
                    } finally {
                        button.disabled = false;
                        button.setAttribute('aria-busy', 'false');
                        button.querySelector('.btn-text').textContent = 'Register';
                    }
                });
            }
        });
    </script>
</body>
</html>
