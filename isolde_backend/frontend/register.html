<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolde AI - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 10px 0 0;
            color: var(--text-main);
            font-size: 24px;
        }

        .brand p {
            color: var(--text-muted);
            margin: 5px 0 0;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: white;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .auth-btn:hover {
            background-color: var(--primary-hover);
        }

        .switch-page {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-page a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .switch-page a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
        .message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .message.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <div style="font-size: 32px;">🤖</div>
            <h1>Create Account</h1>
            <p>Register to use Isolde AI</p>
        </div>

        <div id="message-container" class="message"></div>

        <form id="register-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Your name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn" id="register-btn">
                <span class="btn-text">Register</span>
            </button>
        </form>

        <div class="switch-page">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            const msg = document.getElementById('message-container');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const button = document.getElementById('register-btn');
                    if (button.disabled) return;
                    button.disabled = true;
                    const name = document.getElementById('username').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;

                    try {
                        const res = await fetch('/api/register', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name, email, password})
                        });
                        const data = await res.json();

                        if(res.ok) {
                            msg.textContent = data.message || "Registration successful. Check your email to verify the account.";
                            msg.className = "message success";
                        } else {
                            msg.textContent = data.error || "Registration failed";
                            msg.className = "message error";
                        }
                    } catch(err) {
                        msg.textContent = "Server connection error.";
                        msg.className = "message error";
                    } finally {
                        button.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
