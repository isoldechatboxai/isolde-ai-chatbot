<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolde AI - Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <h1>Welcome to Isolde AI</h1>
        <p>Please sign in to continue</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
