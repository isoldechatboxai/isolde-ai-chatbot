<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Isolde AI - Login</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0b0f19;
            --card-bg: rgba(28, 37, 65, 0.75);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0B132B 0%, #1C2541 50%, #0B132B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 10px 0 0;
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
        }

        .brand p {
            color: var(--text-muted);
            margin: 5px 0 0;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
            transition: opacity 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .guest-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .switch-page {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-page a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .switch-page a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .forgot-link a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .forgot-link a:hover {
            color: var(--primary);
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .message.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* Modal Overlay for Forgot Password */
        #forgot-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: rgba(28, 37, 65, 0.9);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <div style="font-size: 32px;">🤖</div>
            <h1>Welcome Back</h1>
            <p>Your intelligent AI assistant</p>
        </div>

        <div id="message-container" class="message"></div>

        <form id="login-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group" style="margin-bottom: 8px;">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="forgot-link">
                <a href="#" id="open-forgot-modal">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn" id="login-btn">
                <span class="btn-text">Login</span>
            </button>

            <div id="oauth-options" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;"></div>
        </form>

        <div class="switch-page">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <!-- Forgot Password Modal Popup -->
    <div id="forgot-modal">
        <div class="modal-card">
            <h3>Reset Password</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Request a single-use reset link, then paste its token below if this page did not open it automatically.</p>
            
            <div id="modal-msg" class="message" style="margin-bottom: 10px;"></div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="forgot-email" placeholder="name@example.com">
            </div>

            <div class="input-group" id="otp-group" style="display:none;">
                <label>Reset Token / New Password</label>
                <input type="text" id="forgot-token" placeholder="Single-use reset token" style="margin-bottom: 10px;">
                <input type="password" id="new-password" placeholder="New Password">
            </div>

            <button type="button" class="auth-btn" id="send-otp-btn">Send Reset Link</button>
            <button type="button" class="guest-btn" id="verify-reset-btn" style="display:none;">Reset Password</button>
            <button type="button" class="guest-btn" id="close-modal-btn" style="margin-top: 8px;">Cancel</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const msg = document.getElementById('message-container');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const loginButton = document.getElementById('login-btn');
                if (loginButton.disabled) return;
                loginButton.disabled = true;
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email, password})
                    });
                    const data = await res.json();

                    if(res.ok && data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('user', JSON.stringify(data.user || {}));
                        msg.textContent = "Login successful! Redirecting...";
                        msg.className = "message success";
                        setTimeout(() => window.location.href = "/", 1000);
                    } else {
                        msg.textContent = data.error || "Invalid email or password.";
                        msg.className = "message error";
                    }
                } catch(err) {
                    msg.textContent = "Server connection error.";
                    msg.className = "message error";
                } finally {
                    loginButton.disabled = false;
                }
            });

            const oauthStatus = new URLSearchParams(window.location.search).get('oauth');
            if (oauthStatus === 'complete') {
                fetch('/api/oauth/session', {method: 'POST'}).then(async (res) => {
                    const data = await res.json();
                    if (!res.ok || !data.access_token) throw new Error(data.error || 'OAuth login failed.');
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user || {}));
                    history.replaceState({}, '', '/login.html');
                    window.location.replace('/');
                }).catch((error) => {
                    msg.textContent = error.message;
                    msg.className = 'message error';
                });
            }

            fetch('/api/oauth/providers').then((res) => res.json()).then((data) => {
                const container = document.getElementById('oauth-options');
                Object.entries(data.providers || {}).forEach(([provider, configured]) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'guest-btn';
                    button.textContent = `Continue with ${provider[0].toUpperCase() + provider.slice(1)}`;
                    button.disabled = !configured;
                    button.title = configured ? '' : `${provider} login is not configured`;
                    button.addEventListener('click', () => window.location.assign(`/api/oauth/${provider}/start`));
                    container.appendChild(button);
                });
            }).catch(() => {
                const container = document.getElementById('oauth-options');
                container.textContent = 'OAuth provider status unavailable. Email/password login remains available.';
            });

            // Modal Logic
            document.getElementById('open-forgot-modal').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('forgot-modal').style.display = 'flex';
            });
            document.getElementById('close-modal-btn').addEventListener('click', () => {
                document.getElementById('forgot-modal').style.display = 'none';
            });
            document.getElementById('send-otp-btn').addEventListener('click', async () => {
                const email = document.getElementById('forgot-email').value;
                const m = document.getElementById('modal-msg');
                if(!email) { alert("Please enter email"); return; }
                
                try {
                    const res = await fetch('/api/forgot-password', {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email})
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || `Reset request failed (${res.status}).`);
                    m.textContent = data.message || "Reset instructions requested";
                    m.className = "message success";
                    document.getElementById('otp-group').style.display = 'block';
                    document.getElementById('send-otp-btn').style.display = 'none';
                    document.getElementById('verify-reset-btn').style.display = 'block';
                } catch(err) {
                    m.textContent = err.message || "Unable to request reset instructions";
                    m.className = "message error";
                }
            });
            document.getElementById('verify-reset-btn').addEventListener('click', async () => {
                const token = document.getElementById('forgot-token').value;
                const new_password = document.getElementById('new-password').value;
                const m = document.getElementById('modal-msg');

                try {
                    const res = await fetch('/api/reset-password', {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token, new_password})
                    });
                    const data = await res.json();
                    if(res.ok) {
                        m.textContent = data.message;
                        m.className = "message success";
                        setTimeout(() => document.getElementById('forgot-modal').style.display = 'none', 2000);
                    } else {
                        m.textContent = data.error || "Failed";
                        m.className = "message error";
                    }
                } catch(err) {
                    m.textContent = "Server error";
                    m.className = "message error";
                }
            });

            const resetToken = new URLSearchParams(window.location.search).get('token');
            if (resetToken) {
                document.getElementById('forgot-modal').style.display = 'flex';
                document.getElementById('otp-group').style.display = 'block';
                document.getElementById('send-otp-btn').style.display = 'none';
                document.getElementById('verify-reset-btn').style.display = 'block';
                document.getElementById('forgot-token').value = resetToken;
            }
        });
    </script>
</body>
</html>
