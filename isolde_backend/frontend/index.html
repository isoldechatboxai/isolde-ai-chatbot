<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isolde | AI Chatbot</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>  
  <div class="app">

<div class="background-glow"></div>

<header>
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="url(#grad1)"/>
            <path d="M8 12.5C8 12.5 9.5 15 12 15C14.5 15 16 12.5 16 12.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="9" cy="9.5" r="1.2" fill="white"/>
            <circle cx="15" cy="9.5" r="1.2" fill="white"/>
            <defs>
              <linearGradient id="grad1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7C6CF6"/>
                <stop offset="1" stop-color="#5B8DEF"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="title-group">
          <h1>Isolde</h1>
          <span class="subtitle">Your intelligent companion</span>
        </div>
      </div>
      <div class="header-right">
        <button id="clearChatBtn" class="icon-btn" title="Clear chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button id="themeToggle" class="icon-btn" title="Toggle theme">
          <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <!-- Chat container -->
    <main class="chat-container">
      <div class="chat-area" id="chatArea">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-logo">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" fill="url(#grad2)"/>
              <path d="M8 12.5C8 12.5 9.5 15 12 15C14.5 15 16 12.5 16 12.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="9" cy="9.5" r="1.2" fill="white"/>
              <circle cx="15" cy="9.5" r="1.2" fill="white"/>
              <defs>
                <linearGradient id="grad2" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#7C6CF6"/>
                  <stop offset="1" stop-color="#5B8DEF"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2>Hi, I'm Isolde</h2>
          <p>Ask me anything — I'm here to help.</p>
          <div class="suggestions">
            <button class="suggestion-chip" data-text="What can you do?">What can you do?</button>
            <button class="suggestion-chip" data-text="Tell me a fun fact">Tell me a fun fact</button>
            <button class="suggestion-chip" data-text="Help me write an email">Help me write an email</button>
          </div>
        </div>
        <!-- messages get appended here -->
      </div>

      <!-- Typing indicator -->
      <div class="typing-indicator" id="typingIndicator" style="display:none;">
        <div class="message-avatar bot-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#7C6CF6"/></svg>
        </div>
        <div class="typing-bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </main>

    <!-- Input area -->
    <footer class="input-area">
      <div class="input-wrapper">
    <textarea id="messageInput" placeholder="Message Isolde..." rows="1"></textarea>

    <button id="voiceBtn" class="icon-btn" title="Voice Input">
      🎤
    </button>

    <button id="sendBtn" class="send-btn" title="Send message" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>

  </div>

  <p class="disclaimer">
    Isolde may produce inaccurate information. Verify important details.
  </p>
</footer>
  </div>

  <!-- Toast for errors -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
