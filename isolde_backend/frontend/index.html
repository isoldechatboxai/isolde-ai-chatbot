<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Isolde AI</title>
</head>
<body>

  <div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        <img class="brand-logo" src="" alt="Isolde logo" />
        <span class="brand-name">Isolde</span>
      </div>

      <button class="new-chat-btn" type="button">
        <span class="new-chat-icon"></span>
        <span class="new-chat-label">New Chat</span>
      </button>

      <section class="chat-history">
        <h2 class="chat-history-title">Chat History</h2>
        <ul class="chat-history-list">
          <li class="chat-history-item">
            <a class="chat-history-link" href="#">Conversation title</a>
          </li>
        </ul>
      </section>

      <div class="sidebar-footer">

        <section class="user-profile">
          <img class="user-avatar" src="" alt="User avatar" />
          <div class="user-info">
            <span class="user-name">User Name</span>
            <span class="user-email">user@example.com</span>
          </div>
        </section>

        <section class="settings">
          <button class="settings-btn" type="button">
            <span class="settings-icon"></span>
            <span class="settings-label">Settings</span>
          </button>
        </section>

      </div>

    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content">

      <!-- ===== Header ===== -->
      <header class="app-header">
        <h1 class="app-title">Isolde</h1>

        <div class="header-actions">
          <button class="theme-toggle-btn" type="button" title="Toggle theme">
            <span class="theme-toggle-icon"></span>
          </button>

          <button class="clear-chat-btn" type="button" title="Clear chat">
            <span class="clear-chat-icon"></span>
          </button>
        </div>
      </header>

      <!-- ===== Chat Area ===== -->
      <section class="chat-area">

        <div class="welcome-screen">
          <img class="welcome-logo" src="" alt="Isolde logo" />
          <h2 class="welcome-title">Hi, I'm Isolde</h2>
          <p class="welcome-subtitle">Ask me anything — I'm here to help.</p>

          <div class="suggestions">
            <button class="suggestion-chip" type="button">What can you do?</button>
            <button class="suggestion-chip" type="button">Tell me a fun fact</button>
            <button class="suggestion-chip" type="button">Help me write an email</button>
          </div>
        </div>

        <div class="chat-messages" aria-live="polite">

          <article class="message message-user">
            <img class="message-avatar" src="" alt="User avatar" />
            <div class="message-content">
              <p class="message-text">User message goes here.</p>
              <span class="message-time">10:00 AM</span>
            </div>
          </article>

          <article class="message message-bot">
            <img class="message-avatar" src="" alt="Isolde avatar" />
            <div class="message-content">
              <p class="message-text">Bot response goes here.</p>
              <span class="message-time">10:00 AM</span>
              <button class="copy-message-btn" type="button" title="Copy message">Copy</button>
            </div>
          </article>

        </div>

        <div class="typing-indicator">
          <img class="typing-avatar" src="" alt="Isolde avatar" />
          <div class="typing-dots">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>

      </section>

      <!-- ===== Input Area ===== -->
      <section class="input-area">

        <form class="message-form">

          <button class="file-upload-btn" type="button" title="Attach file">
            <span class="file-upload-icon"></span>
          </button>
          <input class="file-upload-input" type="file" hidden />

          <textarea
            class="message-textarea"
            name="message"
            placeholder="Message Isolde..."
            rows="1"
          ></textarea>

          <button class="voice-input-btn" type="button" title="Voice input">
            <span class="voice-input-icon"></span>
          </button>

          <button class="send-btn" type="submit" title="Send message">
            <span class="send-icon"></span>
          </button>

        </form>

      </section>

    </main>

  </div>

  <!-- ============ FOOTER (Optional) ============ -->
 <footer class="app-footer">
    <p class="disclaimer">
        Isolde may produce inaccurate information. Verify important details.
    </p>
</footer>

<script src="script.js"></script>

</body>
</html>
