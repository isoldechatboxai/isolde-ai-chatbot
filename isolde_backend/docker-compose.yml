
services:
  backend:
    build: .
    container_name: isolde-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CANCELLATION_REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://isolde:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/isolde
      RAG_STORAGE_BACKEND: database
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isolde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: isolde
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  pgdata:
