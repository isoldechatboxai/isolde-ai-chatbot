
services:
  backend:
    build: .
    container_name: isolde-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CANCELLATION_REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://isolde:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/isolde
      RAG_STORAGE_BACKEND: database
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isolde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: isolde
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  pgdata:
