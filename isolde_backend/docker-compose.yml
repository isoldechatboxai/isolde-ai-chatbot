
services:
  backend:
    build: .
    container_name: isolde-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./vector_store:/app/vector_store
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Swap SQLite for Postgres in production by uncommenting this service
  # and setting DATABASE_URL=postgresql://isolde:isolde@db:5432/isolde in .env
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: isolde
  #     POSTGRES_PASSWORD: isolde
  #     POSTGRES_DB: isolde
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  redis-data:
  # pgdata:
